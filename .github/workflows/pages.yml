name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The one output that matters: configure-pages reports the path the site
      # will be served under, so the repository name is not written down twice.
      - uses: actions/configure-pages@v5
        id: pages
        if: github.event_name != 'pull_request'

      # Not `pnpm run lint`: lint/fixtures/fixture.tsx is a snapshot the plugin
      # is meant to report on, so oxlint exits non-zero on a clean checkout.
      - run: pnpm run typecheck

      - name: Build
        run: pnpm run build:pages
        env:
          DOCS_BASE_PATH: ${{ steps.pages.outputs.base_path || '/adwaita-cn/' }}

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: build/client

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
